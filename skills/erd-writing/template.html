<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --bg-grad: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.10), transparent 60%),
                 radial-gradient(900px 500px at 110% 10%, rgba(236,72,153,0.08), transparent 60%);
      --surface: rgba(255,255,255,0.72);
      --surface-solid: #ffffff;
      --border: rgba(15,23,42,0.08);
      --border-strong: rgba(15,23,42,0.14);
      --text: #0f172a;
      --text-dim: #475569;
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --code-border: #1e293b;
      --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d12;
        --bg-grad: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.18), transparent 60%),
                   radial-gradient(900px 500px at 110% 10%, rgba(236,72,153,0.12), transparent 60%);
        --surface: rgba(20,24,33,0.72);
        --surface-solid: #14181f;
        --border: rgba(255,255,255,0.06);
        --border-strong: rgba(255,255,255,0.12);
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --code-bg: #07090d;
        --code-text: #e2e8f0;
        --code-border: rgba(255,255,255,0.08);
        --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.4);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image: var(--bg-grad);
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: saturate(140%) blur(12px);
      -webkit-backdrop-filter: saturate(140%) blur(12px);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 4px 12px rgba(99,102,241,0.35);
      flex: 0 0 auto;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: 4px;
    }
    .spacer { flex: 1; }
    .btn {
      font: inherit;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface-solid);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .btn.primary:hover { box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 24px 24px;
    }
    .card {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card + .card { margin-top: 20px; }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-head h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(99,102,241,0.10);
      color: var(--accent);
      border: 1px solid rgba(99,102,241,0.20);
    }
    .diagram {
      position: relative;
      padding: 0;
      overflow: hidden;
      height: calc(100vh - 220px);
      min-height: 480px;
      background:
        radial-gradient(rgba(99,102,241,0.08) 1px, transparent 1px) 0 0 / 22px 22px,
        radial-gradient(rgba(99,102,241,0.04) 1px, transparent 1px) 11px 11px / 22px 22px;
    }
    .diagram pre.mermaid {
      margin: 0;
      background: transparent;
      border: none;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .diagram pre.mermaid svg {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
    }
    .zoom-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      background: var(--surface-solid);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 4px;
      box-shadow: var(--shadow);
      z-index: 5;
    }
    .zoom-controls button {
      font: inherit;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-controls button:hover { background: rgba(99,102,241,0.10); color: var(--accent); }
    .source-wrap { padding: 0; }
    .source-wrap pre {
      margin: 0;
      padding: 18px 20px;
      background: var(--code-bg);
      color: var(--code-text);
      border: none;
      border-top: 1px solid var(--code-border);
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      overflow: auto;
      white-space: pre;
    }
    .footer {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px 32px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--code-bg);
      color: var(--code-text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <h1>{{TITLE}}</h1>
        <span class="meta">· ERD</span>
      </div>
      <div class="spacer"></div>
      <button id="copyBtn" type="button" class="btn primary">Copy Mermaid source</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <h2>Diagram</h2>
        <span class="badge">Mermaid · erDiagram</span>
      </div>
      <div class="diagram">
        <div class="zoom-controls" role="group" aria-label="Zoom controls">
          <button id="zoomOut" type="button" title="Zoom out">−</button>
          <button id="zoomReset" type="button" title="Reset / fit">⤢</button>
          <button id="zoomIn" type="button" title="Zoom in">+</button>
        </div>
        <pre class="mermaid">{{DIAGRAM}}</pre>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Mermaid source</h2>
        <span class="badge">paste-ready</span>
      </div>
      <div class="source-wrap">
        <pre id="src">{{DIAGRAM}}</pre>
      </div>
    </section>
  </main>

  <footer class="footer">
    Generated by <a href="https://github.com/Petrina99/ultra-dev" target="_blank" rel="noopener">ultra-dev-plugin</a> ERD script.
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite">Copied to clipboard</div>

  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: dark ? 'dark' : 'neutral',
      themeVariables: dark
        ? { primaryColor: '#1f2937', primaryTextColor: '#e2e8f0', lineColor: '#64748b', fontFamily: 'Inter, system-ui, sans-serif' }
        : { primaryColor: '#eef2ff', primaryTextColor: '#0f172a', lineColor: '#6366f1', fontFamily: 'Inter, system-ui, sans-serif' },
      er: { useMaxWidth: false },
    });

    const toast = document.getElementById('toast');
    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
    };

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const src = document.getElementById('src').textContent;
      try {
        await navigator.clipboard.writeText(src);
        showToast('Copied to clipboard');
      } catch {
        showToast('Copy failed — select source manually');
      }
    });

    let panZoom = null;

    async function renderDiagram() {
      const host = document.querySelector('.diagram pre.mermaid');
      const source = document.getElementById('src').textContent;
      try {
        const { svg } = await mermaid.render('erd-svg', source);
        host.innerHTML = svg;
        const svgEl = host.querySelector('svg');
        if (svgEl) {
          svgEl.removeAttribute('width');
          svgEl.removeAttribute('height');
          svgEl.style.width = '100%';
          svgEl.style.height = '100%';
          svgEl.style.maxWidth = 'none';
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          if (window.svgPanZoom) {
            panZoom = window.svgPanZoom(svgEl, {
              zoomEnabled: true,
              controlIconsEnabled: false,
              fit: true,
              center: true,
              minZoom: 0.2,
              maxZoom: 10,
              zoomScaleSensitivity: 0.3,
            });
            window.addEventListener('resize', () => { panZoom?.resize(); panZoom?.fit(); panZoom?.center(); });
          }
        }
      } catch (e) {
        host.innerHTML = `<div style="color:#ef4444;padding:24px;font-family:monospace">Mermaid render error: ${String(e.message || e)}</div>`;
      }
    }

    document.getElementById('zoomIn').addEventListener('click', () => panZoom?.zoomIn());
    document.getElementById('zoomOut').addEventListener('click', () => panZoom?.zoomOut());
    document.getElementById('zoomReset').addEventListener('click', () => { panZoom?.resetZoom(); panZoom?.center(); panZoom?.fit(); });

    renderDiagram();
  </script>
</body>
</html>
